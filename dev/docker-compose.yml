services:
  eden:
    build:
      context: ..
      dockerfile: dev/Dockerfile
      # ! All arguments should be passed in by
      # ! "docker compose build --build-arg ***"
      # The defualt values are set within the Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-debian:12}
        CPUS: ${CPUS:-16.0}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: ${IMAGE_NAME:-eden-dev:latest}
    container_name: ${CONTAINER_NAME:-eden-dev}
    cpus: ${CPUS:-16.0}
    gpus: all
    # runtime: nvidia
    # network_mode: host
    shm_size: 16g
    cap_add:
      - IPC_LOCK
      # - SYS_ADMIN
      # - NET_ADMIN
      # - SYS_PTRACE
    privileged: false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    # security_opt:
    #   - seccomp=unconfined
    #   # - seccomp=default
    # deploy:
    #   resources:
    # reservations:
    #   devices:
    #     - driver: nvidia
    #       count: all # alternatively, use `count: all` for all GPUs
    #       capabilities: [gpu]
    volumes:
      - ${PROJECT_ROOT:-..}:/eden
    working_dir: /eden
    stdin_open: true
    tty: true
